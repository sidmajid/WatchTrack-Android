name: Build WatchTrack APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct WatchTrack source
        run: |
          cat source/chunk_*.b64 > WatchTrack-Android-Source.zip.b64
          base64 --decode WatchTrack-Android-Source.zip.b64 > WatchTrack-Android-Source.zip
          unzip -t WatchTrack-Android-Source.zip
          rm -rf build-src
          mkdir -p build-src
          unzip -q WatchTrack-Android-Source.zip -d build-src

      - name: Build debug APK
        working-directory: build-src/WatchTrack-Android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WatchTrack-debug-apk
          path: build-src/WatchTrack-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
